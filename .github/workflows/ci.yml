name: LeadFlow AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/leadflow-test
      AUTH_SECRET: test_secret_for_ci_pipeline_2026
      INTEGRATION_MODE: mock
      GROQ_MODEL: llama-3.3-70b-versatile
      GOOGLE_CLIENT_ID: ci_test_google_client_id
      GOOGLE_CLIENT_SECRET: ci_test_google_client_secret
      TWENTY_API_URL: https://api.twenty.com
      ZAPIER_STATUS_WEBHOOK_SECRET: test_secret_callback

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Run Production Next.js Build
        run: npm run build
